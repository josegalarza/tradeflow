  - name: agg_data_quality
    description: >
      Quarantine summary: what the screening layer rejected, when, why, and at
      what rate. Turns "we drop bad rows" from a claim into an observable, and
      feeds both the dashboard's data quality page and the Slack notifier.

      Grain: one row per model, activity date and reject reason.
    meta:
      layer: "30_marts"
      grain: "one row per model_name, activity_date, reject_reason"
      owner: "data-platform"
      kimball_type: "aggregate"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [model_name, activity_date, reject_reason]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_rejected_rows <= total_rows"
    columns:
      - name: model_name
        description: Which screened model the rejection came from.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["orders", "executions"]
        meta: { classification: internal }
      - name: activity_date
        description: Business date of the rejected rows.
        data_tests: [not_null]
        meta: { classification: internal }
      - name: reject_reason
        description: >
          The specific check that failed, or 'none' for the clean-row rows that
          provide the denominator.
        data_tests: [not_null]
        meta: { classification: internal }
      - name: overall_reject_rate
        description: >
          Rejected rows / total rows for that model and day. The measure the
          quality gate is threshold-tested against.
        meta: { classification: internal }
