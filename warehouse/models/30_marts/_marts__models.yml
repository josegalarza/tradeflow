        meta: { classification: confidential }
      - name: return_on_funded
        description: >
          Total gain / net funded. NULL rather than zero for customers who have
          funded nothing -- an undefined return, not a flat one.
        meta: { classification: confidential }
      - name: open_position_count
        description: Open positions at the latest snapshot date.
        meta: { classification: internal }
      - name: lifetime_fill_count
        description: Fills, lifetime.
        meta: { classification: internal }
      - name: lifetime_order_count
        description: Orders placed, lifetime.
        meta: { classification: internal }
      - name: lifetime_cancelled_count
        description: Orders cancelled, lifetime.
        meta: { classification: internal }
      - name: lifetime_traded_notional_reporting
        description: Gross traded value, lifetime.
        meta: { classification: confidential }
      - name: lifetime_commission_reporting
        description: Commission paid, lifetime. The customer's revenue to us.
        meta: { classification: confidential }
      - name: mean_fill_notional_reporting
        description: Average size of a fill.
        meta: { classification: confidential }
      - name: trading_days
        description: Distinct days on which the customer traded.
        meta: { classification: internal }
      - name: distinct_instruments_traded
        description: Breadth of the customer's trading.
        meta: { classification: internal }
      - name: distinct_sectors_traded
        description: Sector breadth, a crude diversification proxy.
        meta: { classification: internal }
      - name: first_trade_date
        description: Date of first fill.
        meta: { classification: internal }
      - name: last_trade_date
        description: Date of most recent fill.
        meta: { classification: internal }
      - name: largest_trade_symbol
        description: Instrument the customer has committed the most value to.
