name: tradeflow
version: "0.1.0"
config-version: 2

# 1.12 is the version this project is developed and tested against, and the
# generic-test `arguments:` syntax used throughout the schema files is the 1.10+
# form. Pinned below 2.0 so a major upgrade cannot silently change semantics.
require-dbt-version: [">=1.10.0", "<2.0.0"]

profile: tradeflow

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

clean-targets:
  - target
  - dbt_packages

vars:
  # NOTE: the landing zone root is *not* configured here. It is read straight
  # from the TRADEFLOW_LANDING_PATH environment variable in
  # models/10_staging/_landing__sources.yml.
  #
  # It cannot live here: dbt renders Jinja in a single pass, so a var whose value
  # is itself `{{ env_var(...) }}` reaches the source definition as an
  # un-rendered literal and DuckDB tries to parse it as SQL. Env var at the point
  # of use is the only form that works.

  # Single reporting currency for every monetary measure in the marts. Declared
  # once so that "which currency is this number in" has exactly one answer.
  reporting_currency: "USD"

  # fct_positions_daily is a periodic snapshot, and a full-history daily grain
  # is accounts x instruments x days -- which grows quadratically and buys
  # nothing for a demo. We keep a hot trailing window at daily grain and defer
  # full history to the monthly snapshot. See docs/adr/0005.
  positions_snapshot_days: 120

  # Anything with an ingestion timestamp older than this is stale. Consumed by
  # source freshness checks and the observability page.
  freshness_warn_after_hours: 30
  freshness_error_after_hours: 72

  # Quarantine gate. Above this share of rejected rows on any single day, an
  # upstream system has changed shape and the build should stop.
  # 0.1% is chosen to sit above the zero a clean run produces and below the
  # ~0.15-0.35% that --inject-anomalies plants, so both paths are demonstrable.
  max_reject_rate: 0.001
  # Samples smaller than this are excluded from the rate check: one bad row out of
  # three is a 33% reject rate and evidence of nothing. Applies to both the
  # per-day and the all-time scope, so it has to be low enough that the smallest
  # preset still has a measurable all-time rate -- 500 was too high, and the gate
  # silently passed a `--scale tiny` build of deliberately corrupted data.
  min_rows_for_reject_rate: 100

  # Rows sampled by the position reconciliation test. Its correlated subquery is
  # O(snapshots x fills), so the exhaustive form outlasts the build it checks at
  # large scale. A systematic windowing error shows up in the first few hundred
  # rows; that is the only kind of error this test can have.
  reconciliation_sample_rows: 5000

# Every layer gets its own schema, and the layer number is a directory prefix
# so the DAG's shape is visible in the file tree. The dependency rule -- a model
# may only reference its own layer and the one below -- is enforced by
# governance/check_layer_boundaries.py, not by convention alone.
models:
  tradeflow:
    +materialized: view
    10_staging:
      +schema: staging
      +tags: ["staging"]
    20_intermediate:
      +schema: intermediate
      +tags: ["intermediate"]
      # Views, not the conventional ephemeral. Ephemeral models are inlined into
      # their consumers, which means they cannot be queried, cannot be inspected
      # when a number looks wrong, and get recomputed once per reference. The
      # ones referenced several times are promoted to tables individually.
      +materialized: view
    30_marts:
      +schema: marts
      +tags: ["marts"]
      +materialized: table
    # 40_secure is configured in models/40_secure/_secure__models.yml instead of
    # here: the directory is generated by governance/generate_secure_views.py,
    # and a config block pointing at a directory that does not yet exist is
    # exactly the dead configuration this project's warn_error_options exist to
    # catch.

tests:
  tradeflow:
    +store_failures: true
    +schema: dq_failures

on-run-end:
  - "{{ log_run_summary(results) }}"

flags:
  send_anonymous_usage_stats: false
  warn_error_options:
    # Config that applies to nothing is config that is lying about the project's
    # shape, so it fails the build. Scoped to this one event on purpose: `all`
    # also escalates warn-severity *test* results into errors, which silently
    # destroys the detector/gate distinction documented in
    # models/10_staging/_staging__models.yml.
    error:
      - UnusedResourceConfigPath
